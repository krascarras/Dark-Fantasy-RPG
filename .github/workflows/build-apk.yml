name: Build Dark Fantasy RPG - DFR Native (No Gemma)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f icon-512.png

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/darkfantasyrpg/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html
          cp icon-512.png app/src/main/res/drawable/icon_foreground.png
          cp icon-512.png app/src/main/res/mipmap-mdpi/ic_launcher.png

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DarkFantasyRPG"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 90
                  versionName '5.4.11-dfr-native-consistency'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.13.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Dark Fantasy RPG"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:navigationBarColor">#07111F</item>
                  <item name="android:statusBarColor">#07111F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/icon_colors.xml <<'EOF'
          <resources><color name="icon_background">#07111F</color></resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt <<'EOF'
          package com.darkfantasyrpg.app

          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.ValueCallback
          import android.net.Uri
          import android.content.Intent

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemBars()

                  webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      javaScriptCanOpenWindowsAutomatically = false
                      setSupportMultipleWindows(false)
                  }

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          callback: ValueCallback<Array<Uri>>?,
                          params: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = callback
                          return try {
                              val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                                  putExtra(
                                      Intent.EXTRA_MIME_TYPES,
                                      arrayOf(
                                          "application/json",
                                          "image/*",
                                          "text/plain",
                                          "*/*"
                                      )
                                  )
                              }
                              startActivityForResult(
                                  Intent.createChooser(intent, "Choose RPG file"),
                                  4201
                              )
                              true
                          } catch (_: Exception) {
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }

              @Deprecated("Deprecated in Android API")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 4201) {
                      val result =
                          if (resultCode == RESULT_OK && data?.data != null)
                              arrayOf(data.data!!)
                          else null
                      filePathCallback?.onReceiveValue(result)
                      filePathCallback = null
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              private fun hideSystemBars() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify packaged game
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"

          unzip -p "$APK" assets/index.html > /tmp/packaged-index.html

          grep -q 'DFR Native' /tmp/packaged-index.html
          grep -q '0.3.0-consistency' /tmp/packaged-index.html

          if grep -qiE 'litertlm|gemma-4|gemma|AndroidLocalAI|LiteRT' /tmp/packaged-index.html; then
            echo "ERROR: legacy model references remain in packaged HTML"
            exit 1
          fi

          echo "DFR Native no-model package verified."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-v5.4.11-dfr-native-consistency
          path: app/build/outputs/apk/debug/app-debug.apk
