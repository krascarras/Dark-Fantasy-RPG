name: Build Dark Fantasy RPG - DFR Native v7.1.5

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify DFR Native source and regression guards
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f icon-512.png
          cat > /tmp/dfr-native-file.test.mjs <<'DFRTEST'
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          
          const indexPath = path.join(process.cwd(), "index.html");
          const fail = message => { console.error(`FAIL: ${message}`); process.exit(1); };
          if (!fs.existsSync(indexPath)) fail("index.html is missing.");
          const html = fs.readFileSync(indexPath, "utf8");
          
          const required = [
            "DFR Native Intelligence",
            "function dfrNativeGenerate(action)",
            "result=dfrNativeGenerate(v)",
            "dfrNativeGenerate(redo.action||'')",
            "redo.previousEntries=structuredClone(entries)",
            "dfrRememberNative(previous.speaker,dfrIntent(redo.action)",
            "const actionPart=split<0?s:s.slice(0,split)",
            "*${name} looks thoughtful for a moment.*",
            "function commitAIStateTransaction",
            "function applyEngineSceneTransitions",
            "function rpgReconcileRuntimeScene",
            "function isScenePresent",
            "Gerald's Study",
            "Elizabeth Vale",
            "small intercom built into the desk",
            "prefer tea or coffee",
            "v7.1.7-dfr-native",
            "onclick=\"testAI()\"",
            "function testAI()",
            "DFR Native test passed",
            "DFR_NATIVE_LANGUAGE_VERSION='1.0.1-native'",
            "async function idbPutMany(entries)",
            "const postActionState=JSON.stringify(state)",
            "DFR Native relationship transaction failed",
            "|${nativeNonce}`);",
            "DFR package cache unavailable; keeping the main campaign save",
            "const openingGroup=['Gerald Morningstar','Luci Morningstar','Mana Morningstar','Bell Morningstar','Rosaline Morningstar','Evie Morningstar','Ira Morningstar','Freya Morningstar']",
            "Gerald's Study",
            "const people=openingGroup.map",
            "if(!actualArrival)return null",
            "Moving Shane alone changes only his location",
            "*"
          ];
          for (const marker of required) if (!html.includes(marker)) fail(`required DFR Native marker missing: ${marker}`);
          
          const forbidden = [
            "litertlm", "gemma-4", "AndroidLocalAI", "DarkFantasyLocalAI", "LiteRT",
            "LOCAL_AI_DEFAULT_ENDPOINT", "function callStoryAI(", "function localAIRequest(",
            "buildRPGWorkingPrompt", "extractAIStateTransaction", "fetch(",
            "id=\"aiEndpoint\"", "id=\"aiModel\"", "nativeEngine!==false",
            "Morningstar Estate — Gerald\\\'s Study",
            "Morningstar Estate — Gerald's Study",
            "Morningstar Estate — Gerald's Study",
            "dfrRememberPrivateKnowledge(target,`${target.name}/conversation: ${consistency.dialogue}`)"
          ];
          for (const marker of forbidden) if (html.toLowerCase().includes(marker.toLowerCase())) fail(`obsolete model route or known bug marker found: ${marker}`);
          
          const versionPos = html.indexOf("const DFR_NATIVE_LANGUAGE_VERSION='1.0.1-native'");
          const statusPos = html.indexOf('function updateAIStatus()');
          if (versionPos < 0 || statusPos < 0 || versionPos > statusPos) fail("native version constant must be initialised before startup status rendering");
          if (!html.includes('(?:need|needs|want|wants|wish|wishes) to (?:discuss|talk about)')) fail("Gerald invitation questions must recognise natural-language variants");
          const travelBody = html.slice(html.indexOf('function dfrDynamicTravelResponse('), html.indexOf('function dfrAdvanceScenarioForAction('));
          if (travelBody.includes('for(const p of active)setCharacterLocation(p.name,loc')) fail("solo travel still teleports all active NPCs");
          
          if (!/\*[^*\n]{1,200}\*/.test(html)) fail("no asterisk-delimited action text was found.");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) fail("no JavaScript block found in index.html.");
          const combined = scripts.map(m => m[1]).join("\n;\n");
          const tempFile = path.join(os.tmpdir(), `dfr-native-${process.pid}.mjs`);
          fs.writeFileSync(tempFile, combined, "utf8");
          const syntax = spawnSync(process.execPath, ["--check", tempFile], {encoding:"utf8"});
          try {
            if (syntax.status !== 0) { console.error(syntax.stdout); console.error(syntax.stderr); fail("inline JavaScript syntax check failed."); }
          } finally { try { fs.unlinkSync(tempFile); } catch {} }
          
          console.log("PASS: DFR Native v7.1.7 source checks");
          console.log("PASS: no external model endpoint or Android network bridge");
          console.log("PASS: memory, group-entry, solo-travel and save regressions guarded");
          console.log("PASS: player action and Redo use DFR Native");
          console.log("PASS: inline JavaScript syntax valid");
          DFRTEST
          node /tmp/dfr-native-file.test.mjs
          echo "PASS: embedded DFR Native regression tests verified"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets \
            app/src/main/java/com/darkfantasyrpg/app \
            app/src/main/res/values \
            app/src/main/res/drawable \
            app/src/main/res/mipmap-anydpi-v26 \
            app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp icon-512.png app/src/main/res/drawable/icon_foreground.png
          cp icon-512.png app/src/main/res/mipmap-mdpi/ic_launcher.png

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPS

          cat > settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DarkFantasyRPG'
          include(':app')
          SETTINGS

          cat > build.gradle <<'BUILD'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
          }
          BUILD

          cat > app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 112
                  versionName '7.1.7-dfr-native'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          APP

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:hardwareAccelerated="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:label="Dark Fantasy RPG"
                android:theme="@style/AppTheme">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat > app/src/main/res/values/styles.xml <<'STYLE'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:windowFullscreen">true</item>
              <item name="android:colorAccent">#9b7cff</item>
              <item name="android:navigationBarColor">#080b12</item>
              <item name="android:statusBarColor">#080b12</item>
            </style>
          </resources>
          STYLE

          cat > app/src/main/res/values/icon_colors.xml <<'COLORS'
          <resources>
            <color name="icon_background">#080b12</color>
          </resources>
          COLORS

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'ICON'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_background" />
            <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          ICON

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt <<'KOTLIN'
          package com.darkfantasyrpg.app

          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.net.Uri
          import android.content.Intent

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideBars()

                  webView = WebView(this)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                  }

                  webView.webViewClient = WebViewClient()

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          callback: ValueCallback<Array<Uri>>?,
                          params: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = callback

                          return try {
                              val acceptTypes = params?.acceptTypes?.filter { it.isNotBlank() } ?: emptyList()
                              val wantsImage = acceptTypes.any { it.startsWith("image/") }
                              val wantsJson = acceptTypes.any { it.contains("json", ignoreCase = true) }

                              val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = when {
                                      wantsImage && !wantsJson -> "image/*"
                                      wantsImage && wantsJson -> "*/*"
                                      else -> "application/json"
                                  }
                                  if (type == "*/*" || type == "application/json") {
                                      putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/json", "text/json"))
                                  }
                              }
                              startActivityForResult(
                                  Intent.createChooser(intent, "Choose RPG file"),
                                  4201
                              )
                              true
                          } catch (_: Exception) {
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }

              @Deprecated("Deprecated in Android API")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 4201) {
                      filePathCallback?.onReceiveValue(
                          if (resultCode == RESULT_OK && data?.data != null) {
                              arrayOf(data.data!!)
                          } else {
                              null
                          }
                      )
                      filePathCallback = null
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              private fun hideBars() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
              }
          }
          KOTLIN

      - name: Validate generated Android XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          paths = [
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/values/styles.xml",
              "app/src/main/res/values/icon_colors.xml",
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml",
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml",
          ]
          for path in paths:
              ET.parse(path)
          root = ET.parse(paths[0]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          activity = root.find(".//activity")
          if activity is None:
              raise SystemExit("FAIL: launcher activity missing")
          filters = activity.findall("intent-filter")
          if len(filters) != 1:
              raise SystemExit(f"FAIL: expected one launcher intent-filter, got {len(filters)}")
          actions = [node.get(android + "name") for node in filters[0].findall("action")]
          categories = [node.get(android + "name") for node in filters[0].findall("category")]
          if "android.intent.action.MAIN" not in actions or "android.intent.category.LAUNCHER" not in categories:
              raise SystemExit("FAIL: launcher intent-filter is incomplete")
          print("PASS: generated Android XML is valid and launcher intent-filter is well formed")
          PYXML

      - name: Verify offline-only Android configuration
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml
          ! grep -q 'DarkFantasyLocalAI' app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt
          ! grep -q 'allowUniversalAccessFromFileURLs = true' app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt
          echo "PASS: APK has no internet permission, cleartext network allowance, or JavaScript network bridge"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify packaged DFR Native engine
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"

          unzip -l "$APK" | grep -q 'assets/index.html'
          ! unzip -l "$APK" | grep -q 'assets/dfr-native/'
          ! unzip -l "$APK" | grep -q 'assets/sw.js'
          unzip -p "$APK" assets/index.html > /tmp/index.html

          grep -q 'v7.1.7-dfr-native' /tmp/index.html
          grep -q "const DFR_NATIVE_LANGUAGE_VERSION='1.0.1-native'" /tmp/index.html
          ! grep -q 'DarkFantasyLocalAI' /tmp/index.html
          grep -q 'function applyEngineSceneTransitions' /tmp/index.html
          ! grep -q 'nativeEngine!==false' /tmp/index.html
          grep -q 'function dfrNativeGenerate(action)' /tmp/index.html
          grep -q 'result=dfrNativeGenerate(v)' /tmp/index.html
          grep -q "dfrNativeGenerate(redo.action||'')" /tmp/index.html
          grep -q 'DFR Native Intelligence' /tmp/index.html
          ! grep -q 'id="aiEndpoint"' /tmp/index.html
          ! grep -q 'id="aiModel"' /tmp/index.html
          grep -q 'if(!idbOk)' /tmp/index.html
          grep -q 'IndexedDB save failed; using localStorage fallback' /tmp/index.html
          grep -q 'prefer tea or coffee' /tmp/index.html
          grep -q 'small intercom built into the desk' /tmp/index.html
          grep -q 'Elizabeth entered Gerald' /tmp/index.html

          if grep -Eiq 'litertlm|gemma-4|AndroidLocalAI|LiteRT' /tmp/index.html; then
            echo 'Legacy external AI dependency marker found in packaged app.'
            exit 1
          fi

          echo 'Packaged offline-only DFR Native engine verified.'
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-v7.1.7-dfr-native
          path: app/build/outputs/apk/debug/app-debug.apk
