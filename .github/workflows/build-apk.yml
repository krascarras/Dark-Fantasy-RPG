name: Build Dark Fantasy RPG - Local AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Create complete Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/darkfantasyrpg/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi

          # Keep the actual RPG index and use the repository's real artwork as the launcher icon.
          cp index.html app/src/main/assets/index.html
          cp icon-512.png app/src/main/res/drawable/icon_foreground.png
          cp icon-512.png app/src/main/res/mipmap-mdpi/ic_launcher.png

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DarkFantasyRPG"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 43
                  versionName '4.3-local-ai'
              }

              // FIX: Java and Kotlin must compile to the same JVM target.
              // Do NOT add JavaCompile.options.release here.
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = '17'
              }
          }

          dependencies {
              implementation("com.google.ai.edge.litertlm:litertlm-android:latest.release")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Dark Fantasy RPG"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <uses-native-library
                      android:name="libvndksupport.so"
                      android:required="false" />
                  <uses-native-library
                      android:name="libOpenCL.so"
                      android:required="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:navigationBarColor">#07111F</item>
                  <item name="android:statusBarColor">#07111F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/icon_colors.xml <<'EOF'
          <resources>
              <color name="icon_background">#07111F</color>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt <<'EOF'
          package com.darkfantasyrpg.app

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Contents
          import com.google.ai.edge.litertlm.Conversation
          import com.google.ai.edge.litertlm.ConversationConfig
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.io.File
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private val mainHandler = Handler(Looper.getMainLooper())

              private var engine: Engine? = null
              private var conversation: Conversation? = null
              private var engineLoading = false

              private val modelDir by lazy { File(filesDir, "models") }
              private val modelFile by lazy {
                  File(modelDir, "gemma-4-E4B-it.litertlm")
              }
              private val partFile by lazy {
                  File(modelDir, "gemma-4-E4B-it.litertlm.part")
              }

              private val modelUrl =
                  "https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm?download=true"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemBars()

                  webView = WebView(this)
                  val settings: WebSettings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.allowFileAccess = true
                  settings.allowContentAccess = true
                  settings.javaScriptCanOpenWindowsAutomatically = false
                  settings.setSupportMultipleWindows(false)

                  webView.webViewClient = WebViewClient()
                  webView.addJavascriptInterface(LocalAI(), "AndroidLocalAI")
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              private fun hideSystemBars() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
              }

              override fun onDestroy() {
                  scope.launch(Dispatchers.IO) {
                      try { conversation?.close() } catch (_: Exception) {}
                      try { engine?.close() } catch (_: Exception) {}
                  }
                  super.onDestroy()
              }

              inner class LocalAI {
                  @JavascriptInterface
                  fun isModelInstalled(): Boolean =
                      modelFile.exists() && modelFile.length() > 100_000_000L

                  @JavascriptInterface
                  fun downloadModel() {
                      if (isModelInstalled()) {
                          postJsStatus("Local AI model is already installed.")
                          Toast.makeText(this@MainActivity, "Local AI is already installed.", Toast.LENGTH_LONG).show()
                          return
                      }
                      if (engineLoading) {
                          postJsStatus("Local AI is already preparing.")
                          return
                      }

                      postJsStatus("⬇ Local AI download starting…")
                      Toast.makeText(this@MainActivity, "Local AI model download started. Keep the game open.", Toast.LENGTH_LONG).show()

                      scope.launch(Dispatchers.IO) {
                          try {
                              modelDir.mkdirs()
                              downloadWithResume()
                              postJsStatus("✓ Local AI model installed. Tap Test AI.")
                              mainHandler.post {
                                  Toast.makeText(this@MainActivity, "✓ Local AI installed. Tap Test AI.", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              postJsError("Model download failed: ${e.message ?: e.javaClass.simpleName}")
                          }
                      }
                  }

                  @JavascriptInterface
                  fun generate(requestId: String, prompt: String) {
                      if (!isModelInstalled()) {
                          postJsError(requestId, "The local AI model is not installed. Download it first.")
                          return
                      }

                      scope.launch(Dispatchers.IO) {
                          try {
                              ensureEngine()
                              val conv = conversation
                                  ?: throw IllegalStateException("Local AI conversation unavailable")

                              val result = StringBuilder()
                              conv.sendMessageAsync(prompt).collect { chunk ->
                                  result.append(chunk)
                              }

                              postJsResult(requestId, result.toString())
                          } catch (e: Exception) {
                              postJsError(
                                  requestId,
                                  "Local AI failed: ${e.message ?: e.javaClass.simpleName}"
                              )
                          }
                      }
                  }
              }

              private suspend fun ensureEngine() {
                  if (conversation != null) return

                  if (engineLoading) {
                      while (engineLoading) delay(100)
                      if (conversation != null) return
                  }

                  engineLoading = true
                  try {
                      val cacheDir = File(cacheDir, "litertlm-cache").apply { mkdirs() }

                      val config = EngineConfig(
                          modelPath = modelFile.absolutePath,
                          backend = Backend.CPU(),
                          cacheDir = cacheDir.absolutePath
                      )

                      val e = Engine(config)
                      e.initialize()
                      engine = e

                      conversation = e.createConversation(
                          ConversationConfig(
                              systemInstruction = Contents.of(
                                  """
                                  You are the local narrative engine for Shane's Dark Fantasy RPG.

                                  Treat the RPG's supplied canon, character descriptions,
                                  relationship state, memories, current scene and player
                                  action as authoritative.

                                  Never invent visual facts that contradict supplied character
                                  canon. Preserve named character traits. Write natural,
                                  fluid fantasy prose rather than repetitive stock phrases.

                                  Follow the output format requested by the game.
                                  """.trimIndent()
                              )
                          )
                      )
                  } finally {
                      engineLoading = false
                  }
              }

              private fun downloadWithResume() {
                  val existing = if (partFile.exists()) partFile.length() else 0L

                  val connection =
                      (URL(modelUrl).openConnection() as HttpURLConnection).apply {
                          connectTimeout = 30_000
                          readTimeout = 120_000
                          instanceFollowRedirects = true
                          setRequestProperty("User-Agent", "DarkFantasyRPG/LocalAI")
                          if (existing > 0) {
                              setRequestProperty("Range", "bytes=$existing-")
                          }
                      }

                  try {
                      val code = connection.responseCode
                      if (code != HttpURLConnection.HTTP_OK &&
                          code != HttpURLConnection.HTTP_PARTIAL) {
                          throw IllegalStateException("HTTP $code")
                      }

                      val append =
                          code == HttpURLConnection.HTTP_PARTIAL && existing > 0

                      if (!append && existing > 0) {
                          partFile.delete()
                      }

                      val total =
                          if (code == HttpURLConnection.HTTP_PARTIAL) {
                              existing + connection.contentLengthLong
                          } else {
                              connection.contentLengthLong
                          }

                      connection.inputStream.use { input ->
                          RandomAccessFile(partFile, "rw").use { output ->
                              if (append) output.seek(existing)
                              else output.setLength(0)

                              val buffer = ByteArray(1024 * 1024)
                              var downloaded = if (append) existing else 0L
                              var lastPercent = -1

                              while (true) {
                                  val read = input.read(buffer)
                                  if (read <= 0) break

                                  output.write(buffer, 0, read)
                                  downloaded += read

                                  if (total > 0) {
                                      val percent =
                                          ((downloaded * 100L) / total).toInt()

                                      if (percent != lastPercent && percent % 2 == 0) {
                                          lastPercent = percent
                                          postJsStatus("Downloading local AI model… $percent%")
                                      }
                                  }
                              }
                          }
                      }

                      if (!partFile.exists() || partFile.length() < 100_000_000L) {
                          throw IllegalStateException("Downloaded file is incomplete")
                      }

                      if (modelFile.exists()) modelFile.delete()

                      if (!partFile.renameTo(modelFile)) {
                          throw IllegalStateException("Could not finalise model file")
                      }
                  } finally {
                      connection.disconnect()
                  }
              }

              private fun postJsStatus(message: String) {
                  mainHandler.post {
                      val escaped = jsString(message)
                      webView.evaluateJavascript(
                          "window.__localAIStatus && window.__localAIStatus('$escaped')",
                          null
                      )
                  }
              }

              private fun postJsResult(requestId: String, text: String) {
                  mainHandler.post {
                      webView.evaluateJavascript(
                          "window.onLocalAIResult('${jsString(requestId)}','${jsString(text)}')",
                          null
                      )
                  }
              }

              private fun postJsError(requestId: String, message: String) {
                  mainHandler.post {
                      webView.evaluateJavascript(
                          "window.onLocalAIError('${jsString(requestId)}','${jsString(message)}')",
                          null
                      )
                  }
              }

              private fun postJsError(message: String) {
                  postJsStatus("✗ $message")
                  mainHandler.post {
                      Toast.makeText(this, message, Toast.LENGTH_LONG).show()
                  }
              }

              private fun jsString(value: String): String =
                  value.replace("\", "\\")
                      .replace("'", "\'")
                      .replace("\n", "\\n")
                      .replace("\r", "\\r")
                      .replace("</", "<\\/")
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-v4.3-local-AI
          path: app/build/outputs/apk/debug/app-debug.apk
