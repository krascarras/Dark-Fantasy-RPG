name: Build Dark Fantasy RPG - Local AI (v5.3.0)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Create complete Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f icon-512.png

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/darkfantasyrpg/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html
          cp icon-512.png app/src/main/res/drawable/icon_foreground.png
          cp icon-512.png app/src/main/res/mipmap-mdpi/ic_launcher.png

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DarkFantasyRPG"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 84
                  versionName '5.3.0-rpg-runtime-integrity'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = '17'
              }
          }

          dependencies {
              implementation("com.google.ai.edge.litertlm:litertlm-android:latest.release")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Dark Fantasy RPG"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <uses-native-library android:name="libvndksupport.so" android:required="false" />
                  <uses-native-library android:name="libOpenCL.so" android:required="false" />
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:navigationBarColor">#07111F</item>
                  <item name="android:statusBarColor">#07111F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/icon_colors.xml <<'EOF'
          <resources><color name="icon_background">#07111F</color></resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt <<'EOF'
          package com.darkfantasyrpg.app

          import android.app.Activity
          import android.app.DownloadManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.Environment
          import android.view.View
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import android.webkit.ValueCallback
          import android.widget.Toast
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Content
          import com.google.ai.edge.litertlm.Contents
          import com.google.ai.edge.litertlm.ConversationConfig
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.io.File
          import java.io.FileInputStream
          import java.security.MessageDigest

          private const val MODEL_SIZE_BYTES = 2588147712L
          private const val MODEL_SHA256 = "181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c"

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private val mainHandler = Handler(Looper.getMainLooper())
              private var engine: Engine? = null
              private var engineLoading = false
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              private val modelDir by lazy { File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir, "models") }
              private val modelFile by lazy { File(modelDir, "gemma-4-E2B-it.litertlm") }
              private val verifiedMarkerFile by lazy { File(modelDir, "gemma-4-E2B-it.litertlm.verified") }
              private var downloadId: Long? = null
              private val modelUrl = "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm?download=true"

              private fun modelSha256(file: File = modelFile): String {
                  val digest = MessageDigest.getInstance("SHA-256")
                  FileInputStream(file).use { input ->
                      val buffer = ByteArray(1024 * 1024)
                      while (true) { val read = input.read(buffer); if (read < 0) break; if (read > 0) digest.update(buffer, 0, read) }
                  }
                  return digest.digest().joinToString("") { "%02x".format(it) }
              }

              private fun modelIsComplete(file: File): Boolean = file.exists() && file.length() == MODEL_SIZE_BYTES

              private fun verifyAndMarkModel(): Boolean {
                  if (!modelIsComplete(modelFile)) return false
                  if (!modelSha256(modelFile).equals(MODEL_SHA256, ignoreCase = true)) return false
                  if (!verifiedMarkerFile.exists()) verifiedMarkerFile.createNewFile()
                  return true
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemBars()
                  webView = WebView(this)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      javaScriptCanOpenWindowsAutomatically = false
                      setSupportMultipleWindows(false)
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(view: WebView?, filePath: ValueCallback<Array<Uri>>?, fileChooserParams: FileChooserParams?): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePath
                          return try {
                              val acceptTypes = fileChooserParams?.acceptTypes?.flatMap { it.split(",") }?.map { it.trim().lowercase() }?.filter { it.isNotEmpty() } ?: emptyList()
                              val wantsJson = acceptTypes.any { it == "application/json" || it == "text/json" || it == ".json" || it.endsWith("/json") }
                              val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = if (wantsJson) "application/json" else "image/*"
                                  if (wantsJson) putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/json", "text/json", "*/*"))
                              }
                              startActivityForResult(Intent.createChooser(intent, if (wantsJson) "Choose scenario or character JSON" else "Choose character picture"), 4201)
                              true
                          } catch (_: Exception) { this@MainActivity.filePathCallback = null; false }
                      }
                  }
                  webView.addJavascriptInterface(LocalAI(), "AndroidLocalAI")
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }

              @Deprecated("Deprecated in Android API")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 4201) {
                      val result = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      filePathCallback?.onReceiveValue(result)
                      filePathCallback = null
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) { super.onWindowFocusChanged(hasFocus); if (hasFocus) hideSystemBars() }

              private fun hideSystemBars() {
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
              }

              override fun onDestroy() {
                  downloadId = null
                  scope.launch(Dispatchers.IO) { try { engine?.close() } catch (_: Exception) {} }
                  super.onDestroy()
              }

              inner class LocalAI {
                  @JavascriptInterface fun isModelInstalled(): Boolean {
                      return try {
                          if (verifiedMarkerFile.exists() && modelIsComplete(modelFile)) true
                          else if (modelIsComplete(modelFile)) verifyAndMarkModel() else false
                      } catch (_: Exception) { false }
                  }

                  @JavascriptInterface fun downloadModel() {
                      if (isModelInstalled()) { postJsStatus("✓ Local AI model is already installed."); return }
                      if (downloadId != null) { postJsStatus("⬇ Local AI download is already running…"); return }
                      scope.launch(Dispatchers.IO) {
                          try {
                              modelDir.mkdirs()
                              val partFile = File(modelDir, "gemma-4-E2B-it.litertlm.part")
                              if (modelIsComplete(modelFile)) {
                                  postJsStatus("✓ Model file found. Verifying existing download…")
                                  if (verifyAndMarkModel()) { postJsStatus("✓ Local AI model installed and verified (${modelFile.length() / 1_048_576L} MB)."); return@launch }
                                  modelFile.delete(); verifiedMarkerFile.delete()
                              }
                              if (partFile.exists()) partFile.delete()
                              verifiedMarkerFile.delete()
                              val request = DownloadManager.Request(Uri.parse(modelUrl)).apply {
                                  setTitle("Dark Fantasy RPG — Local AI")
                                  setDescription("Downloading Gemma 4 E2B (on-device)")
                                  setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                  setAllowedOverMetered(true)
                                  setAllowedOverRoaming(false)
                                  setMimeType("application/octet-stream")
                                  setDestinationUri(Uri.fromFile(partFile))
                                  addRequestHeader("User-Agent", "DarkFantasyRPG/LocalAI")
                              }
                              val manager = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                              val id = manager.enqueue(request)
                              downloadId = id
                              postJsStatus("⬇ Download queued — Android Download Manager is starting…")
                              while (true) {
                                  val query = DownloadManager.Query().setFilterById(id)
                                  manager.query(query).use { cursor ->
                                      if (!cursor.moveToFirst()) throw IllegalStateException("Download disappeared from Android Download Manager")
                                      val status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                                      val bytes = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR))
                                      val total = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES))
                                      when (status) {
                                          DownloadManager.STATUS_PENDING -> postJsStatus("⬇ Download queued…")
                                          DownloadManager.STATUS_RUNNING -> postJsStatus(if (total > 0L) "Downloading local AI model… ${((bytes * 100L) / total).toInt()}% (${bytes / 1_048_576L} / ${total / 1_048_576L} MB)" else "Downloading local AI model… ${bytes / 1_048_576L} MB downloaded")
                                          DownloadManager.STATUS_PAUSED -> postJsStatus("Download paused by Android…")
                                          DownloadManager.STATUS_FAILED -> throw IllegalStateException("Android Download Manager failed")
                                          DownloadManager.STATUS_SUCCESSFUL -> {
                                              if (!partFile.exists()) throw IllegalStateException("Download reported success but the temporary model file was not found")
                                              if (partFile.length() != MODEL_SIZE_BYTES) throw IllegalStateException("Downloaded model size is ${partFile.length()} bytes; expected $MODEL_SIZE_BYTES bytes")
                                              postJsStatus("✓ Download complete. Verifying model integrity…")
                                              if (!modelSha256(partFile).equals(MODEL_SHA256, ignoreCase = true)) throw IllegalStateException("Model SHA-256 mismatch")
                                              if (modelFile.exists()) modelFile.delete()
                                              if (!partFile.renameTo(modelFile)) throw IllegalStateException("Verified model could not be moved into place")
                                              if (!verifyAndMarkModel()) throw IllegalStateException("Verified model could not be marked as installed")
                                              downloadId = null
                                              postJsStatus("✓ Local AI model installed and verified (${modelFile.length() / 1_048_576L} MB).")
                                              break
                                          }
                                      }
                                  }
                                  delay(1000)
                              }
                          } catch (e: Exception) { downloadId = null; postDownloadFailure(e.message ?: e.toString()) }
                      }
                  }

                  @JavascriptInterface fun generate(requestId: String, prompt: String) {
                      if (!isModelInstalled()) { postJsError(requestId, "The local AI model is not installed. Download it first."); return }
                      scope.launch(Dispatchers.IO) {
                          try {
                              postJsStatus("Generating with Gemma 4 E2B on-device…")
                              val e = ensureEngine()
                              val conv = e.createConversation(ConversationConfig(systemInstruction = Contents.of(Content.Text("""You are the local narrative engine for an RPG. Follow the scenario and character canon supplied in the current request. Return natural story prose only. Never return JSON, code, metadata, bullet summaries or <think> blocks. Shane is player-controlled: never invent Shane's thoughts, feelings, dialogue, intentions, decisions or actions.""".trimIndent()))))
                              val result = StringBuilder()
                              conv.sendMessageAsync(prompt).collect { chunk -> result.append(chunk) }
                              val text = result.toString().trim()
                              if (text.isEmpty()) throw IllegalStateException("Model returned empty text")
                              postJsResult(requestId, text)
                              postJsStatus("✓ Local AI response received")
                          } catch (e: Exception) { postJsError(requestId, "Local AI failed: ${e.message ?: e.javaClass.simpleName}") }
                      }
                  }
              }

              private suspend fun ensureEngine(): Engine {
                  engine?.let { return it }
                  if (engineLoading) { while (engineLoading) delay(100); engine?.let { return it } }
                  engineLoading = true
                  try {
                      val cacheDir = File(cacheDir, "litertlm-cache").apply { mkdirs() }
                      val e = Engine(EngineConfig(modelPath = modelFile.absolutePath, backend = Backend.CPU(), cacheDir = cacheDir.absolutePath))
                      e.initialize(); engine = e; return e
                  } finally { engineLoading = false }
              }

              private fun postDownloadFailure(message: String) { postJsStatus("✗ $message"); mainHandler.post { Toast.makeText(this@MainActivity, "Local AI download failed", Toast.LENGTH_LONG).show() } }
              private fun postJsStatus(message: String) { mainHandler.post { webView.evaluateJavascript("window.__localAIStatus && window.__localAIStatus('${jsString(message)}')", null) } }
              private fun postJsResult(requestId: String, text: String) { mainHandler.post { webView.evaluateJavascript("window.onLocalAIResult('${jsString(requestId)}','${jsString(text)}')", null) } }
              private fun postJsError(requestId: String, message: String) { mainHandler.post { webView.evaluateJavascript("window.onLocalAIError('${jsString(requestId)}','${jsString(message)}')", null) } }
              private fun postJsError(message: String) { postJsStatus("✗ $message"); mainHandler.post { Toast.makeText(this, message, Toast.LENGTH_LONG).show() } }
              private fun jsString(value: String): String =
                  value.replace("\\", "\\\\")
                      .replace("'", "\\'")
                      .replace("\n", "\\n")
                      .replace("\r", "\\r")
                      .replace("</", "<\\/")
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify packaged HTML and APK version
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html > /tmp/packaged-index.html
          grep -q 'v5.3.0' /tmp/packaged-index.html
          grep -q "RPG_CORE_VERSION='5.3.0'" /tmp/packaged-index.html
          echo "Packaged index.html verified as v5.3.0"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-v5.3.0-runtime-integrity
          path: app/build/outputs/apk/debug/app-debug.apk
