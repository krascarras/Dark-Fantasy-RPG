name: Build Dark Fantasy RPG APK - Local AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Create Android project
        shell: bash
        run: |
          set -e
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/darkfantasyrpg/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DarkFantasyRPG"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 41
                  versionName '4.1-local-ai-ui'
              }
          }

          dependencies {
              implementation("com.google.ai.edge.litertlm:litertlm-android:latest.release")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="Dark Fantasy RPG"
                  android:icon="@drawable/dark_fantasy_icon"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false">
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <uses-native-library android:name="libvndksupport.so" android:required="false"/>
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#080f1a</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/dark_fantasy_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#111111" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#777777" android:pathData="M54,12a42,42 0,1 0,0 84a42,42 0,1 0,0 -84"/>
          </vector>
          EOF

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt <<'EOF'
          package com.darkfantasyrpg.app
          
          import android.Manifest
          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.Build
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.view.View
                    import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Contents
          import com.google.ai.edge.litertlm.Conversation
          import com.google.ai.edge.litertlm.ConversationConfig
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL
          
          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private val mainHandler = Handler(Looper.getMainLooper())
          
              private var engine: Engine? = null
              private var conversation: Conversation? = null
              private var engineLoading = false
          
              private val modelDir by lazy { File(filesDir, "models") }
              private val modelFile by lazy { File(modelDir, "gemma-4-E4B-it.litertlm") }
              private val partFile by lazy { File(modelDir, "gemma-4-E4B-it.litertlm.part") }
              private val notificationId = 4201
              private val notificationChannelId = "local_ai_download"
          
              // Official LiteRT Community model. The APK does not contain this multi-GB file.
              private val modelUrl =
                  "https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm?download=true"
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
          
                  webView = WebView(this)
                  val settings: WebSettings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.allowFileAccess = true
                  settings.allowContentAccess = true
                  settings.javaScriptCanOpenWindowsAutomatically = false
                  settings.setSupportMultipleWindows(false)
          
                  webView.webViewClient = WebViewClient()
                  webView.addJavascriptInterface(LocalAI(), "AndroidLocalAI")
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }
          
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              private fun hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.let { controller ->
                          controller.hide(android.view.WindowInsets.Type.statusBars() or android.view.WindowInsets.Type.navigationBars())
                          controller.systemBarsBehavior = android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE)
                  }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          notificationChannelId,
                          "AI model download",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun postDownloadNotification(percent: Int, downloaded: Long, total: Long, complete: Boolean = false, failed: Boolean = false) {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return
                  val title = when {
                      complete -> "Dark Fantasy RPG — AI ready"
                      failed -> "Dark Fantasy RPG — AI download failed"
                      else -> "Dark Fantasy RPG — Downloading AI"
                  }
                  val text = when {
                      complete -> "AI model downloaded successfully"
                      failed -> "The AI model download did not complete"
                      total > 0 -> "${percent}% • ${downloaded / (1024 * 1024)} MB / ${total / (1024 * 1024)} MB"
                      else -> "Downloading AI model…"
                  }
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      android.app.Notification.Builder(this, notificationChannelId)
                  } else {
                      @Suppress("DEPRECATION")
                      android.app.Notification.Builder(this)
                  }
                  builder.setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setOngoing(!complete && !failed)
                      .setOnlyAlertOnce(true)
                  if (!complete && !failed && total > 0) builder.setProgress(100, percent.coerceIn(0, 100), false)
                  if (complete || failed) builder.setProgress(0, 0, false)
                  getSystemService(NotificationManager::class.java).notify(notificationId, builder.build())
              }

              private fun finishDownloadNotification() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return
                  getSystemService(NotificationManager::class.java).cancel(notificationId)
              }

              override fun onDestroy() {
                  scope.launch(Dispatchers.IO) {
                      try { conversation?.close() } catch (_: Exception) {}
                      try { engine?.close() } catch (_: Exception) {}
                  }
                  super.onDestroy()
              }
          
              inner class LocalAI {
                  @JavascriptInterface
                  fun isModelInstalled(): Boolean = modelFile.exists() && modelFile.length() > 100_000_000L
          
                  @JavascriptInterface
                  fun downloadModel() {
                      if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          mainHandler.post { requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 4202) }
                      }
                      if (modelFile.exists() && modelFile.length() > 100_000_000L) {
                          postJsStatus("Local AI model is already installed.")
                          return
                      }
                      if (engineLoading) {
                          postJsStatus("Local AI is already preparing.")
                          return
                      }
          
                      scope.launch(Dispatchers.IO) {
                          try {
                              modelDir.mkdirs()
                              downloadWithResume()
                              postDownloadNotification(100, modelFile.length(), modelFile.length(), complete = true)
                              postJsStatus("✓ Local AI model downloaded. Tap Test AI.")
                          } catch (e: Exception) {
                              postDownloadNotification(0, partFile.length(), 0L, failed = true)
                              postJsError("Model download failed: ${e.message ?: e.javaClass.simpleName}")
                          }
                      }
                  }
          
                  @JavascriptInterface
                  fun generate(requestId: String, prompt: String) {
                      if (!isModelInstalled()) {
                          postJsError(requestId, "The local AI model is not installed. Download it first.")
                          return
                      }
          
                      scope.launch(Dispatchers.IO) {
                          try {
                              ensureEngine()
                              val conv = conversation ?: throw IllegalStateException("Local AI conversation unavailable")
                              val result = StringBuilder()
                              conv.sendMessageAsync(prompt).collect { chunk ->
                                  result.append(chunk)
                              }
                              postJsResult(requestId, result.toString())
                          } catch (e: Exception) {
                              postJsError(requestId, "Local AI failed: ${e.message ?: e.javaClass.simpleName}")
                          }
                      }
                  }
              }
          
              private suspend fun ensureEngine() {
                  if (conversation != null) return
                  if (engineLoading) {
                      while (engineLoading) kotlinx.coroutines.delay(100)
                      if (conversation != null) return
                  }
          
                  engineLoading = true
                  try {
                      val cacheDir = File(cacheDir, "litertlm-cache").apply { mkdirs() }
          
                      // CPU is the safest first benchmark. Once E4B is proven stable, we can
                      // benchmark GPU/NPU on the Xperia and switch to the faster backend.
                      val config = EngineConfig(
                          modelPath = modelFile.absolutePath,
                          backend = Backend.CPU(),
                          cacheDir = cacheDir.absolutePath
                      )
                      val e = Engine(config)
                      e.initialize()
                      engine = e
          
                      val conversationConfig = ConversationConfig(
                          systemInstruction = Contents.of(
                              "You are the local narrative engine for Shane's Dark Fantasy RPG. " +
                              "Follow the RPG prompt supplied with each request exactly. " +
                              "Return only the requested JSON."
                          )
                      )
                      conversation = e.createConversation(conversationConfig)
                  } finally {
                      engineLoading = false
                  }
              }
          
              private fun downloadWithResume() {
                  val existing = if (partFile.exists()) partFile.length() else 0L
                  val connection = (URL(modelUrl).openConnection() as HttpURLConnection).apply {
                      connectTimeout = 30_000
                      readTimeout = 120_000
                      instanceFollowRedirects = true
                      setRequestProperty("User-Agent", "DarkFantasyRPG/LocalAI")
                      if (existing > 0) setRequestProperty("Range", "bytes=$existing-")
                  }
          
                  try {
                      val code = connection.responseCode
                      if (code != HttpURLConnection.HTTP_OK &&
                          code != HttpURLConnection.HTTP_PARTIAL) {
                          throw IllegalStateException("HTTP $code")
                      }
          
                      val append = code == HttpURLConnection.HTTP_PARTIAL && existing > 0
                      if (!append && existing > 0) {
                          partFile.delete()
                      }
          
                      val total = if (code == HttpURLConnection.HTTP_PARTIAL) {
                          existing + connection.contentLengthLong
                      } else {
                          connection.contentLengthLong
                      }
          
                      connection.inputStream.use { input ->
                          RandomAccessFile(partFile, "rw").use { output ->
                              if (append) output.seek(existing) else output.setLength(0)
                              val buffer = ByteArray(1024 * 1024)
                              var downloaded = if (append) existing else 0L
                              var lastPercent = -1
                              while (true) {
                                  val read = input.read(buffer)
                                  if (read <= 0) break
                                  output.write(buffer, 0, read)
                                  downloaded += read
                                  if (total > 0) {
                                      val percent = ((downloaded * 100L) / total).toInt()
                                      if (percent != lastPercent && percent % 2 == 0) {
                                          lastPercent = percent
                                          postJsStatus("Downloading local AI model… $percent%")
                                          postDownloadNotification(percent, downloaded, total)
                                      }
                                  }
                              }
                          }
                      }
                      if (!partFile.exists() || partFile.length() < 100_000_000L) {
                          throw IllegalStateException("Downloaded file is incomplete")
                      }
                      if (modelFile.exists()) modelFile.delete()
                      if (!partFile.renameTo(modelFile)) {
                          throw IllegalStateException("Could not finalise model file")
                      }
                  } finally {
                      connection.disconnect()
                  }
              }
          
              private fun postJsStatus(message: String) {
                  mainHandler.post {
                      val escaped = message.replace("\\", "\\\\").replace("'", "\\'").replace("\n", "\\n")
                      webView.evaluateJavascript("window.__localAIStatus && window.__localAIStatus('$escaped')", null)
                  }
              }
          
              private fun postJsResult(requestId: String, text: String) {
                  mainHandler.post {
                      val id = requestId.jsString()
                      val payload = text.jsString()
                      webView.evaluateJavascript("window.onLocalAIResult('$id','$payload')", null)
                  }
              }
          
              private fun postJsError(requestId: String, message: String) {
                  mainHandler.post {
                      webView.evaluateJavascript(
                          "window.onLocalAIError('${requestId.jsString()}','${message.jsString()}')",
                          null
                      )
                  }
              }
          
              private fun String.jsString(): String =
                  replace("\\", "\\\\")
                      .replace("'", "\\'")
                      .replace("\n", "\\n")
                      .replace("\r", "\\r")
                      .replace("</", "<\\/")
          
              private fun postJsError(message: String) {
                  postJsStatus("✗ $message")
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-local-ai-e4b
          path: app/build/outputs/apk/debug/app-debug.apk
