name: Build Dark Fantasy RPG APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RPG
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Create Android WebView project
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          rm -rf app build settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/darkfantasyrpg/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/index.html
          cp icon-512.png app/src/main/res/drawable/icon.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DarkFantasyRPG"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 43
                  versionName '4.3'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="Dark Fantasy RPG"
                  android:icon="@drawable/icon"
                  android:roundIcon="@drawable/icon"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.java <<'EOF'
          package com.darkfantasyrpg.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private final ExecutorService localAiExecutor = Executors.newCachedThreadPool();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          try {
                              Intent intent = fileChooserParams.createIntent();
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                              return true;
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              filePathCallback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });

                  webView.addJavascriptInterface(new LocalAIBridge(), "DarkFantasyLocalAI");

                  setImmersive();
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              private void setImmersive() {
                  if (webView == null) return;
                  webView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST_CODE) return;

                  if (filePathCallback == null) return;
                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      Uri single = data.getData();
                      if (single != null) {
                          results = new Uri[]{single};
                      } else if (data.getClipData() != null) {
                          int count = data.getClipData().getItemCount();
                          results = new Uri[count];
                          for (int i = 0; i < count; i++) {
                              results[i] = data.getClipData().getItemAt(i).getUri();
                          }
                      }
                  }
                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) setImmersive();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.removeJavascriptInterface("DarkFantasyLocalAI");
                      webView.destroy();
                      webView = null;
                  }
                  localAiExecutor.shutdownNow();
                  super.onDestroy();
              }

              private class LocalAIBridge {
                  @JavascriptInterface
                  public void post(String endpoint, String body, String requestId) {
                      localAiExecutor.execute(() -> {
                          boolean ok = false;
                          String responseBody = "";
                          HttpURLConnection connection = null;
                          try {
                              URL url = new URL(endpoint);
                              String protocol = url.getProtocol();
                              if (!"http".equalsIgnoreCase(protocol) && !"https".equalsIgnoreCase(protocol)) {
                                  throw new IllegalArgumentException("Local AI endpoint must use http:// or https://");
                              }

                              connection = (HttpURLConnection) url.openConnection();
                              connection.setRequestMethod("POST");
                              connection.setConnectTimeout(10000);
                              connection.setReadTimeout(60000);
                              connection.setDoOutput(true);
                              connection.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                              connection.setRequestProperty("Accept", "application/json");

                              byte[] payload = body.getBytes(StandardCharsets.UTF_8);
                              try (OutputStream out = connection.getOutputStream()) {
                                  out.write(payload);
                              }

                              int code = connection.getResponseCode();
                              InputStream stream = code >= 200 && code < 400
                                      ? connection.getInputStream()
                                      : connection.getErrorStream();
                              if (stream != null) {
                                  try (BufferedReader reader = new BufferedReader(
                                          new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                                      StringBuilder result = new StringBuilder();
                                      String line;
                                      while ((line = reader.readLine()) != null) {
                                          result.append(line);
                                      }
                                      responseBody = result.toString();
                                  }
                              }

                              ok = code >= 200 && code < 300;
                              if (!ok && responseBody.isEmpty()) {
                                  responseBody = "Local AI HTTP " + code;
                              }
                          } catch (Exception e) {
                              responseBody = e.getMessage() == null ? e.toString() : e.getMessage();
                          } finally {
                              if (connection != null) connection.disconnect();
                          }

                          final boolean finalOk = ok;
                          final String finalBody = responseBody;
                          if (webView != null) {
                              webView.post(() -> {
                                  try {
                                      String js = "window.__darkFantasyAIResolve("
                                              + JSONObject.quote(requestId) + ","
                                              + (finalOk ? "true" : "false") + ","
                                              + JSONObject.quote(finalBody) + ");";
                                      webView.evaluateJavascript(js, null);
                                  } catch (Exception ignored) {
                                  }
                              });
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK directly
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-v4.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-v4.3-project
          path: |
            index.html
            .github/workflows/*.yml
          if-no-files-found: warn
