name: Build Dark Fantasy RPG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RPG
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/darkfantasyrpg/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # The RPG is kept exactly as it is in the repository.
          cp index.html app/src/main/assets/index.html

          # Copy optional web-app files if they exist.
          cp manifest.webmanifest app/src/main/assets/ 2>/dev/null || true
          cp sw.js app/src/main/assets/ 2>/dev/null || true
          cp favicon.png app/src/main/assets/ 2>/dev/null || true
          cp icon-192.png app/src/main/assets/ 2>/dev/null || true

          # Use the existing repository icon. No base64 artwork is embedded
          # in this workflow, keeping the workflow file small.
          test -f icon-512.png
          cp icon-512.png app/src/main/assets/icon-512.png
          cp icon-512.png app/src/main/res/drawable/dark_fantasy_icon.png

          # Adaptive launcher icon for Android 8+.
          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:inset="8%">
              <bitmap
                  android:src="@drawable/dark_fantasy_icon"
                  android:gravity="fill" />
          </inset>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # Legacy launcher icon fallback.
          cp icon-512.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon-512.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon-512.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon-512.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DarkFantasyRPG"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Dark Fantasy RPG"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#080f1a</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.java <<'EOF'
          package com.darkfantasyrpg.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-icon-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
