name: Build Dark Fantasy RPG - DFR World Brain

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify DFR World Brain single-file source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html

          cat > /tmp/dfr-world-brain.test.mjs <<'TEST'
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { spawnSync } from "node:child_process";

          const indexPath = path.join(process.cwd(), "index.html");
          const fail = message => { console.error(`FAIL: ${message}`); process.exit(1); };
          if (!fs.existsSync(indexPath)) fail("index.html is missing.");
          const html = fs.readFileSync(indexPath, "utf8");

          const required = [
            "DFR World Brain",
            "DFR World Brain, the narrative intelligence running inside a persistent RPG world",
            "function callStoryAI",
            "function buildRPGWorkingPrompt",
            "function commitAIStateTransaction",
            "function applyEngineSceneTransitions",
            "function rpgReconcileRuntimeScene",
            "function isScenePresent",
            "DFR_REFRESH_VARIANT",
            "Gerald's Study",
            "Elizabeth Vale",
            "small intercom built into the desk",
            "prefer tea or coffee",
            "v7.1.2-dfr-world-brain",
            "onclick=\"testAI()\"",
            "function testAI()",
            "aiEndpoint",
            "aiModel",
            "DarkFantasyLocalAI",
            "*"
          ];
          for (const marker of required) if (!html.includes(marker)) fail(`required World Brain marker missing: ${marker}`);

          const forbiddenPrimaryPath = ["nativeEngine!==false"];
          for (const marker of forbiddenPrimaryPath) if (html.includes(marker)) fail(`legacy Native primary-path marker still present: ${marker}`);

          const forbiddenDependencies = ["litertlm", "gemma-4", "AndroidLocalAI", "LiteRT"];
          for (const marker of forbiddenDependencies) if (html.toLowerCase().includes(marker.toLowerCase())) fail(`legacy external AI dependency marker found: ${marker}`);

          if (!/\*[^*\n]{1,200}\*/.test(html)) fail("no asterisk-delimited action text was found.");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) fail("no JavaScript block found in index.html.");
          const combined = scripts.map(m => m[1]).join("\n;\n");
          const tempFile = path.join(os.tmpdir(), `dfr-world-brain-${process.pid}.mjs`);
          fs.writeFileSync(tempFile, combined, "utf8");
          const syntax = spawnSync(process.execPath, ["--check", tempFile], {encoding:"utf8"});
          try { if (syntax.status !== 0) { console.error(syntax.stdout); console.error(syntax.stderr); fail("inline JavaScript syntax check failed."); } } finally { try { fs.unlinkSync(tempFile); } catch {} }
          console.log("PASS: DFR World Brain source checks");
          console.log("PASS: World Brain is the primary narrative architecture");
          console.log("PASS: opening scene transitions are engine-owned");
          console.log("PASS: endpoint/model controls present");
          console.log("PASS: Android local-AI bridge markers present");
          console.log("PASS: legacy external AI dependency markers absent");
          console.log("PASS: inline JavaScript syntax valid");
          TEST

          node /tmp/dfr-world-brain.test.mjs

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets \
            app/src/main/java/com/darkfantasyrpg/app \
            app/src/main/res/values \
            app/src/main/res/drawable \
            app/src/main/res/mipmap-anydpi-v26 \
            app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp sw.js app/src/main/assets/sw.js
          cp icon-512.png app/src/main/res/drawable/icon_foreground.png
          cp icon-512.png app/src/main/res/mipmap-mdpi/ic_launcher.png

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PROPS

          cat > settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DarkFantasyRPG'
          include(':app')
          SETTINGS

          cat > build.gradle <<'BUILD'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
          }
          BUILD

          cat > app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.darkfantasyrpg.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.darkfantasyrpg.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 107
                  versionName '7.1.2-dfr-world-brain'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation('androidx.webkit:webkit:1.13.0')
          }
          APP

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:hardwareAccelerated="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:label="Dark Fantasy RPG"
                android:usesCleartextTraffic="true"
                android:theme="@style/AppTheme">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat > app/src/main/res/values/styles.xml <<'STYLE'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:windowFullscreen">true</item>
              <item name="android:colorAccent">#9b7cff</item>
              <item name="android:navigationBarColor">#080b12</item>
              <item name="android:statusBarColor">#080b12</item>
            </style>
          </resources>
          STYLE

          cat > app/src/main/res/values/icon_colors.xml <<'COLORS'
          <resources>
            <color name="icon_background">#080b12</color>
          </resources>
          COLORS

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'ICON'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_background" />
            <foreground android:drawable="@drawable/icon_foreground" />
          </adaptive-icon>
          ICON

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt <<'KOTLIN'
          package com.darkfantasyrpg.app

          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.JavascriptInterface
          import android.net.Uri
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private val aiExecutor = Executors.newCachedThreadPool()
              private val mainHandler = Handler(Looper.getMainLooper())

              inner class LocalAIBridge {
                  @JavascriptInterface
                  fun post(endpoint: String, payload: String, requestId: String) {
                      aiExecutor.execute {
                          var connection: HttpURLConnection? = null
                          try {
                              val url = URL(endpoint)
                              connection = (url.openConnection() as HttpURLConnection).apply {
                                  requestMethod = "POST"
                                  connectTimeout = 10000
                                  readTimeout = 120000
                                  doOutput = true
                                  setRequestProperty("Content-Type", "application/json")
                                  setRequestProperty("Accept", "application/json")
                              }

                              OutputStreamWriter(connection.outputStream, Charsets.UTF_8).use {
                                  it.write(payload)
                              }

                              val code = connection.responseCode
                              val stream = if (code in 200..299) connection.inputStream else connection.errorStream
                              val body = BufferedReader(InputStreamReader(stream, Charsets.UTF_8)).use { it.readText() }

                              if (code !in 200..299) {
                                  postResult(requestId, false, "Local AI HTTP $code: $body")
                              } else {
                                  postResult(requestId, true, body)
                              }
                          } catch (e: Exception) {
                              postResult(requestId, false, e.message ?: "Local AI request failed")
                          } finally {
                              connection?.disconnect()
                          }
                      }
                  }

                  private fun postResult(requestId: String, ok: Boolean, body: String) {
                      val idJson = JSONObject.quote(requestId)
                      val bodyJson = JSONObject.quote(body)
                      val script = "window.onLocalAIResult($idJson, $bodyJson, ${if (ok) "true" else "false"});"
                      mainHandler.post {
                          if (::webView.isInitialized) webView.evaluateJavascript(script, null)
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideBars()

                  webView = WebView(this)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                  }

                  webView.webViewClient = WebViewClient()
                  webView.settings.allowUniversalAccessFromFileURLs = true
                  webView.addJavascriptInterface(LocalAIBridge(), "DarkFantasyLocalAI")

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          callback: ValueCallback<Array<Uri>>?,
                          params: FileChooserParams?
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = callback

                          return try {
                              val acceptTypes = params?.acceptTypes?.filter { it.isNotBlank() } ?: emptyList()
                              val wantsImage = acceptTypes.any { it.startsWith("image/") }
                              val wantsJson = acceptTypes.any { it.contains("json", ignoreCase = true) }

                              val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = when {
                                      wantsImage && !wantsJson -> "image/*"
                                      wantsImage && wantsJson -> "*/*"
                                      else -> "application/json"
                                  }
                                  if (type == "*/*" || type == "application/json") {
                                      putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/json", "text/json"))
                                  }
                              }
                              startActivityForResult(
                                  Intent.createChooser(intent, "Choose RPG file"),
                                  4201
                              )
                              true
                          } catch (_: Exception) {
                              filePathCallback = null
                              false
                          }
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }

              @Deprecated("Deprecated in Android API")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 4201) {
                      filePathCallback?.onReceiveValue(
                          if (resultCode == RESULT_OK && data?.data != null) {
                              arrayOf(data.data!!)
                          } else {
                              null
                          }
                      )
                      filePathCallback = null
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              private fun hideBars() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
              }
          }
          KOTLIN

      - name: Verify Android local-AI bridge configuration
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' app/src/main/AndroidManifest.xml
          grep -q 'DarkFantasyLocalAI' app/src/main/java/com/darkfantasyrpg/app/MainActivity.kt
          echo "PASS: Android INTERNET permission"
          echo "PASS: Android cleartext local-AI networking"
          echo "PASS: DarkFantasyLocalAI bridge"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify packaged DFR World Brain engine
        shell: bash
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"

          unzip -l "$APK" | grep -q 'assets/index.html'
          ! unzip -l "$APK" | grep -q 'assets/dfr-native/'
          unzip -p "$APK" assets/index.html > /tmp/index.html

          grep -q 'v7.1.2-dfr-world-brain' /tmp/index.html
          grep -q 'function applyEngineSceneTransitions' /tmp/index.html
          ! grep -q 'nativeEngine!==false' /tmp/index.html
          grep -q 'aiEndpoint' /tmp/index.html
          grep -q 'aiModel' /tmp/index.html
          grep -q 'function callStoryAI' /tmp/index.html
          grep -q 'DFR World Brain, the narrative intelligence running inside a persistent RPG world' /tmp/index.html
          grep -q 'DFR_REFRESH_VARIANT' /tmp/index.html
          grep -q 'if(!idbOk)' /tmp/index.html
          grep -q 'IndexedDB save failed; using localStorage fallback' /tmp/index.html
          grep -q 'prefer tea or coffee' /tmp/index.html
          grep -q 'small intercom built into the desk' /tmp/index.html
          grep -q 'Elizabeth entered Gerald' /tmp/index.html

          if grep -Eiq 'litertlm|gemma-4|AndroidLocalAI|LiteRT' /tmp/index.html; then
            echo 'Legacy external AI dependency marker found in packaged app.'
            exit 1
          fi

          echo 'Packaged DFR World Brain single-file engine verified.'
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Fantasy-RPG-v7.1.2-dfr-world-brain
          path: app/build/outputs/apk/debug/app-debug.apk
